<svg viewBox="0 0 950 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d1f3c"/>
    </marker>
  </defs>

  <!-- Application box -->
  <rect x="30" y="110" width="160" height="90" rx="10" fill="#dce8f5" stroke="#4a7ab5" stroke-width="2"/>
  <text x="110" y="148" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Application</text>
  <text x="110" y="165" text-anchor="middle" font-size="11" fill="#555">(e.g. web app,</text>
  <text x="110" y="179" text-anchor="middle" font-size="11" fill="#555">mobile app, backend)</text>

  <!-- API request arrow -->
  <line x1="190" y1="135" x2="310" y2="135" stroke="#0d1f3c" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="250" y="125" text-anchor="middle" font-weight="bold" font-size="11" fill="#0d1f3c">API request</text>
  <text x="250" y="138" text-anchor="middle" font-size="10" fill="#555">(upload / retrieve / manage object)</text>

  <!-- API response arrow -->
  <line x1="310" y1="175" x2="190" y2="175" stroke="#0d1f3c" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="250" y="192" text-anchor="middle" font-weight="bold" font-size="11" fill="#0d1f3c">API response</text>
  <text x="250" y="205" text-anchor="middle" font-size="10" fill="#555">(object data / status)</text>

  <!-- Amazon S3 outer box -->
  <rect x="310" y="60" width="220" height="200" rx="12" fill="#d5ecd5" stroke="#4a9a4a" stroke-width="2"/>
  <text x="420" y="90" text-anchor="middle" font-weight="bold" font-size="17" fill="#0d1f3c">Amazon S3</text>

  <!-- S3 Bucket inner box -->
  <rect x="330" y="105" width="180" height="130" rx="10" fill="#a8d5a2" stroke="#3a7a3a" stroke-width="2"/>
  <text x="420" y="130" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">S3 Bucket</text>
  <text x="420" y="147" text-anchor="middle" font-size="11" fill="#0d1f3c">(Container for objects)</text>
  <rect x="355" y="158" width="130" height="60" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5"/>
  <text x="420" y="192" text-anchor="middle" font-size="13" fill="#333">my-app-bucket</text>

  <!-- Arrow S3 to Objects panel -->
  <line x1="530" y1="100" x2="600" y2="60" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="160" x2="600" y2="160" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="220" x2="600" y2="260" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Objects in the bucket panel -->
  <rect x="595" y="20" width="320" height="300" rx="10" fill="#f0f4ff" stroke="#aab" stroke-width="1.5"/>
  <text x="755" y="48" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">Objects in the bucket</text>

  <!-- Object 1 -->
  <rect x="615" y="58" width="280" height="70" rx="8" fill="#dce8f5" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="630" y="78" font-weight="bold" font-size="13" fill="#0d1f3c">Object 1</text>
  <text x="630" y="96" font-size="11" fill="#333">Key:   users/123/profile.jpg</text>
  <text x="630" y="111" font-size="11" fill="#333">Size:  120 KB   |   Type: image/jpeg</text>

  <!-- Object 2 -->
  <rect x="615" y="140" width="280" height="70" rx="8" fill="#fef3c7" stroke="#c9a227" stroke-width="1.5"/>
  <text x="630" y="160" font-weight="bold" font-size="13" fill="#0d1f3c">Object 2</text>
  <text x="630" y="178" font-size="11" fill="#333">Key:   docs/report.pdf</text>
  <text x="630" y="193" font-size="11" fill="#333">Size:  2 MB   |   Type: application/pdf</text>

  <!-- Object 3 -->
  <rect x="615" y="222" width="280" height="70" rx="8" fill="#ede0f5" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="630" y="242" font-weight="bold" font-size="13" fill="#0d1f3c">Object 3</text>
  <text x="630" y="260" font-size="11" fill="#333">Key:   videos/intro.mp4</text>
  <text x="630" y="275" font-size="11" fill="#333">Size:  15 MB   |   Type: video/mp4</text>
</svg>
