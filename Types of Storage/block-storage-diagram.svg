<svg viewBox="0 0 620 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d1f3c"/>
    </marker>
  </defs>

  <!-- Application -->
  <rect x="60" y="20" width="220" height="70" rx="10" fill="#dce8f5" stroke="#4a7ab5" stroke-width="2"/>
  <text x="170" y="60" text-anchor="middle" font-weight="bold" font-size="16" fill="#0d1f3c">Application</text>
  <text x="360" y="55" font-size="12" fill="#555">Sends read/write</text>
  <text x="360" y="70" font-size="12" fill="#555">requests for data</text>

  <!-- Arrow -->
  <line x1="170" y1="90" x2="170" y2="130" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Operating System -->
  <rect x="60" y="130" width="220" height="70" rx="10" fill="#d5ecd5" stroke="#4a9a4a" stroke-width="2"/>
  <text x="170" y="170" text-anchor="middle" font-weight="bold" font-size="16" fill="#0d1f3c">Operating System</text>
  <text x="360" y="162" font-size="12" fill="#555">Treats the volume</text>
  <text x="360" y="177" font-size="12" fill="#555">like a disk</text>

  <!-- Arrow -->
  <line x1="170" y1="200" x2="170" y2="240" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Filesystem -->
  <rect x="60" y="240" width="220" height="70" rx="10" fill="#fde8c0" stroke="#d4853a" stroke-width="2"/>
  <text x="170" y="280" text-anchor="middle" font-weight="bold" font-size="16" fill="#0d1f3c">Filesystem</text>
  <text x="360" y="272" font-size="12" fill="#555">Organizes data into</text>
  <text x="360" y="287" font-size="12" fill="#555">files and directories</text>

  <!-- Arrow -->
  <line x1="170" y1="310" x2="170" y2="350" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage Volume -->
  <rect x="60" y="350" width="220" height="80" rx="10" fill="#e8d5f5" stroke="#7c5cbf" stroke-width="2"/>
  <text x="170" y="385" text-anchor="middle" font-weight="bold" font-size="16" fill="#0d1f3c">Storage Volume</text>
  <text x="170" y="403" text-anchor="middle" font-size="12" fill="#0d1f3c">(e.g. Amazon EBS)</text>
  <text x="360" y="385" font-size="12" fill="#555">A block storage volume</text>
  <text x="360" y="400" font-size="12" fill="#555">attached to the instance</text>

  <!-- Arrow -->
  <line x1="170" y1="430" x2="170" y2="460" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Blocks container -->
  <rect x="40" y="460" width="260" height="110" rx="10" fill="#dce8f5" stroke="#4a7ab5" stroke-width="2"/>
  <text x="170" y="483" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Blocks</text>
  <text x="170" y="498" text-anchor="middle" font-size="11" fill="#555">(fixed-size blocks)</text>

  <!-- Block grid -->
  <rect x="55" y="505" width="68" height="30" rx="5" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="89" y="525" text-anchor="middle" font-size="11" fill="#0d1f3c">Block 1</text>
  <rect x="131" y="505" width="68" height="30" rx="5" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="165" y="525" text-anchor="middle" font-size="11" fill="#0d1f3c">Block 2</text>
  <rect x="207" y="505" width="68" height="30" rx="5" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="241" y="525" text-anchor="middle" font-size="11" fill="#0d1f3c">Block 3</text>
  <rect x="55" y="540" width="68" height="25" rx="5" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="89" y="557" text-anchor="middle" font-size="11" fill="#0d1f3c">Block 4</text>
  <rect x="131" y="540" width="68" height="25" rx="5" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="165" y="557" text-anchor="middle" font-size="11" fill="#0d1f3c">Block 5</text>
  <rect x="207" y="540" width="68" height="25" rx="5" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="241" y="557" text-anchor="middle" font-size="11" fill="#0d1f3c">Block 6</text>

  <text x="360" y="510" font-size="12" fill="#555">Data is stored in fixed-size</text>
  <text x="360" y="525" font-size="12" fill="#555">blocks that can be read or</text>
  <text x="360" y="540" font-size="12" fill="#555">written individually</text>
</svg>
