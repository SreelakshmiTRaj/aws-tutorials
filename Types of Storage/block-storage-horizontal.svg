<svg viewBox="0 0 1050 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d1f3c"/>
    </marker>
  </defs>

  <!-- Application -->
  <rect x="20" y="50" width="160" height="70" rx="10" fill="#dce8f5" stroke="#4a7ab5" stroke-width="2"/>
  <text x="100" y="90" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Application</text>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#555">Sends read/write</text>
  <text x="100" y="153" text-anchor="middle" font-size="11" fill="#555">requests for data</text>

  <line x1="180" y1="85" x2="230" y2="85" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Operating System -->
  <rect x="230" y="50" width="160" height="70" rx="10" fill="#d5ecd5" stroke="#4a9a4a" stroke-width="2"/>
  <text x="310" y="83" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Operating</text>
  <text x="310" y="100" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">System</text>
  <text x="310" y="140" text-anchor="middle" font-size="11" fill="#555">Treats the volume</text>
  <text x="310" y="153" text-anchor="middle" font-size="11" fill="#555">like a disk</text>

  <line x1="390" y1="85" x2="440" y2="85" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Filesystem -->
  <rect x="440" y="50" width="160" height="70" rx="10" fill="#fde8c0" stroke="#d4853a" stroke-width="2"/>
  <text x="520" y="90" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Filesystem</text>
  <text x="520" y="140" text-anchor="middle" font-size="11" fill="#555">Organizes data into</text>
  <text x="520" y="153" text-anchor="middle" font-size="11" fill="#555">files and directories</text>

  <line x1="600" y1="85" x2="650" y2="85" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Storage Volume -->
  <rect x="650" y="40" width="170" height="90" rx="10" fill="#e8d5f5" stroke="#7c5cbf" stroke-width="2"/>
  <text x="735" y="78" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Storage Volume</text>
  <text x="735" y="96" text-anchor="middle" font-size="12" fill="#0d1f3c">(e.g. Amazon EBS)</text>
  <text x="735" y="148" text-anchor="middle" font-size="11" fill="#555">A block storage volume</text>
  <text x="735" y="161" text-anchor="middle" font-size="11" fill="#555">attached to the instance</text>

  <line x1="820" y1="85" x2="860" y2="85" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Blocks -->
  <rect x="855" y="20" width="180" height="140" rx="10" fill="#dce8f5" stroke="#4a7ab5" stroke-width="2"/>
  <text x="945" y="45" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">Blocks</text>
  <text x="945" y="60" text-anchor="middle" font-size="11" fill="#555">(fixed-size blocks)</text>
  <rect x="868" y="68" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="892" y="85" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 1</text>
  <rect x="922" y="68" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="946" y="85" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 2</text>
  <rect x="976" y="68" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="1000" y="85" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 3</text>
  <rect x="868" y="100" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="892" y="117" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 4</text>
  <rect x="922" y="100" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="946" y="117" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 5</text>
  <rect x="976" y="100" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="1000" y="117" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 6</text>
  <rect x="868" y="132" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="892" y="149" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 7</text>
  <rect x="922" y="132" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="946" y="149" text-anchor="middle" font-size="10" fill="#0d1f3c">Block 8</text>
  <rect x="976" y="132" width="48" height="25" rx="4" fill="#b8d4ee" stroke="#4a7ab5" stroke-width="1"/>
  <text x="1000" y="149" text-anchor="middle" font-size="10" fill="#0d1f3c">...</text>

  <text x="945" y="178" text-anchor="middle" font-size="10" fill="#555">Data is stored in fixed-size blocks</text>
  <text x="945" y="191" text-anchor="middle" font-size="10" fill="#555">that can be read or written individually</text>
</svg>
