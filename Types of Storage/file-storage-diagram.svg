<svg viewBox="0 0 950 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d1f3c"/>
    </marker>
  </defs>

  <!-- Multiple Servers container -->
  <rect x="30" y="20" width="480" height="120" rx="12" fill="#dce8f5" stroke="#4a7ab5" stroke-width="2"/>
  <text x="240" y="48" text-anchor="middle" font-weight="bold" font-size="17" fill="#0d1f3c">Multiple Servers</text>
  <rect x="55" y="60" width="110" height="55" rx="8" fill="#f0f6ff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="110" y="92" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">Server 1</text>
  <rect x="185" y="60" width="110" height="55" rx="8" fill="#f0f6ff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="240" y="92" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">Server 2</text>
  <rect x="315" y="60" width="110" height="55" rx="8" fill="#f0f6ff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="370" y="92" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">Server 3</text>

  <!-- Note 1 -->
  <rect x="540" y="20" width="380" height="70" rx="8" fill="#dce8f5" stroke="#4a7ab5" stroke-width="1"/>
  <text x="555" y="43" font-size="12" fill="#333">Multiple servers (or clients)</text>
  <text x="555" y="58" font-size="12" fill="#333">can access the same file</text>
  <text x="555" y="73" font-size="12" fill="#333">system at the same time.</text>

  <!-- Lines from servers to Shared FS -->
  <line x1="110" y1="115" x2="240" y2="200" stroke="#0d1f3c" stroke-width="1.5"/>
  <line x1="240" y1="115" x2="240" y2="200" stroke="#0d1f3c" stroke-width="1.5"/>
  <line x1="370" y1="115" x2="240" y2="200" stroke="#0d1f3c" stroke-width="1.5"/>
  <line x1="240" y1="170" x2="240" y2="200" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Shared File System -->
  <rect x="90" y="200" width="300" height="65" rx="10" fill="#d5ecd5" stroke="#4a9a4a" stroke-width="2"/>
  <text x="240" y="238" text-anchor="middle" font-weight="bold" font-size="17" fill="#0d1f3c">Shared File System</text>

  <!-- Note 2 -->
  <rect x="540" y="120" width="380" height="110" rx="8" fill="#d5ecd5" stroke="#4a9a4a" stroke-width="1"/>
  <text x="555" y="143" font-size="12" fill="#333">A single file system that can be</text>
  <text x="555" y="158" font-size="12" fill="#333">accessed by multiple servers over</text>
  <text x="555" y="173" font-size="12" fill="#333">the network (e.g., using NFS or</text>
  <text x="555" y="188" font-size="12" fill="#333">SMB). It stores data in a central</text>
  <text x="555" y="203" font-size="12" fill="#333">location and makes it available</text>
  <text x="555" y="218" font-size="12" fill="#333">to all connected servers.</text>

  <!-- Lines from Shared FS to folders -->
  <line x1="160" y1="265" x2="130" y2="330" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="265" x2="350" y2="330" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- /documents folder -->
  <rect x="50" y="330" width="160" height="55" rx="8" fill="#fde8c0" stroke="#d4853a" stroke-width="2"/>
  <text x="130" y="363" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">/documents</text>

  <!-- /images folder -->
  <rect x="270" y="330" width="160" height="55" rx="8" fill="#fde8c0" stroke="#d4853a" stroke-width="2"/>
  <text x="350" y="363" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d1f3c">/images</text>

  <!-- Note 3 -->
  <rect x="540" y="260" width="380" height="70" rx="8" fill="#fde8c0" stroke="#d4853a" stroke-width="1"/>
  <text x="555" y="283" font-size="12" fill="#333">The file system is organized</text>
  <text x="555" y="298" font-size="12" fill="#333">into folders (directories),</text>
  <text x="555" y="313" font-size="12" fill="#333">just like a regular filesystem.</text>

  <!-- Lines from /documents to files -->
  <line x1="95" y1="385" x2="80" y2="430" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="385" x2="175" y2="430" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lines from /images to files -->
  <line x1="315" y1="385" x2="300" y2="430" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="385" x2="400" y2="430" stroke="#0d1f3c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- report.pdf -->
  <rect x="30" y="430" width="110" height="50" rx="8" fill="#e0d7f5" stroke="#7c5cbf" stroke-width="1.5"/>
  <text x="85" y="460" text-anchor="middle" font-weight="bold" font-size="12" fill="#0d1f3c">report.pdf</text>

  <!-- notes.txt -->
  <rect x="148" y="430" width="110" height="50" rx="8" fill="#e0d7f5" stroke="#7c5cbf" stroke-width="1.5"/>
  <text x="203" y="460" text-anchor="middle" font-weight="bold" font-size="12" fill="#0d1f3c">notes.txt</text>

  <!-- logo.png -->
  <rect x="260" y="430" width="110" height="50" rx="8" fill="#e0d7f5" stroke="#7c5cbf" stroke-width="1.5"/>
  <text x="315" y="460" text-anchor="middle" font-weight="bold" font-size="12" fill="#0d1f3c">logo.png</text>

  <!-- banner.jpg -->
  <rect x="378" y="430" width="110" height="50" rx="8" fill="#e0d7f5" stroke="#7c5cbf" stroke-width="1.5"/>
  <text x="433" y="460" text-anchor="middle" font-weight="bold" font-size="12" fill="#0d1f3c">banner.jpg</text>

  <!-- Note 4 -->
  <rect x="540" y="360" width="380" height="90" rx="8" fill="#e0d7f5" stroke="#7c5cbf" stroke-width="1"/>
  <text x="555" y="383" font-size="12" fill="#333">Files are stored inside</text>
  <text x="555" y="398" font-size="12" fill="#333">folders and can be accessed</text>
  <text x="555" y="413" font-size="12" fill="#333">by any of the connected</text>
  <text x="555" y="428" font-size="12" fill="#333">servers using the same path.</text>
</svg>
