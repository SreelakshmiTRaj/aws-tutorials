<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Application -->
  <rect x="30" y="70" width="160" height="70" rx="10" fill="#dce8f5" stroke="#4a7ab5" stroke-width="2"/>
  <text x="110" y="108" text-anchor="middle" font-weight="bold" font-size="16" fill="#0d1f3c">Application</text>

  <!-- Arrow: Application to Bucket -->
  <line x1="190" y1="105" x2="270" y2="105" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="95" text-anchor="middle" font-size="11" fill="#555">Upload /</text>
  <text x="230" y="108" text-anchor="middle" font-size="11" fill="#555">Retrieve Object</text>

  <!-- Bucket -->
  <rect x="270" y="70" width="150" height="70" rx="10" fill="#d5ecd5" stroke="#4a9a4a" stroke-width="2"/>
  <text x="345" y="108" text-anchor="middle" font-weight="bold" font-size="16" fill="#0d1f3c">Bucket</text>

  <!-- Arrow: Bucket to Object -->
  <line x1="420" y1="105" x2="500" y2="105" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="98" text-anchor="middle" font-size="11" fill="#555">Stores</text>

  <!-- Object -->
  <rect x="500" y="70" width="150" height="70" rx="10" fill="#f7dfc0" stroke="#d4853a" stroke-width="2"/>
  <text x="575" y="108" text-anchor="middle" font-weight="bold" font-size="16" fill="#0d1f3c">Object</text>

  <!-- Arrow: Object to Data -->
  <line x1="650" y1="85" x2="720" y2="50" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow: Object to Metadata -->
  <line x1="650" y1="105" x2="720" y2="105" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow: Object to Key -->
  <line x1="650" y1="125" x2="720" y2="160" stroke="#0d1f3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data -->
  <rect x="720" y="20" width="140" height="50" rx="8" fill="#e0d7f5" stroke="#7c5cbf" stroke-width="2"/>
  <text x="790" y="50" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Data</text>

  <!-- Metadata -->
  <rect x="720" y="80" width="140" height="50" rx="8" fill="#fef3c7" stroke="#c9a227" stroke-width="2"/>
  <text x="790" y="110" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Metadata</text>

  <!-- Key -->
  <rect x="720" y="140" width="140" height="50" rx="8" fill="#fdd5d5" stroke="#c94040" stroke-width="2"/>
  <text x="790" y="170" text-anchor="middle" font-weight="bold" font-size="15" fill="#0d1f3c">Key</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d1f3c"/>
    </marker>
  </defs>
</svg>
